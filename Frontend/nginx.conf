server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Swagger manages its own policy; this static app policy would block Swagger scripts.
    add_header X-Content-Type-Options nosniff always;
  }
  location = /config.json { add_header Cache-Control no-store; }
  location = /sw.js { add_header Cache-Control no-cache; add_header Service-Worker-Allowed /; }
  location = /manifest.webmanifest { default_type application/manifest+json; }
  location / { try_files $uri $uri/ /index.html; }
}
