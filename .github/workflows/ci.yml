name: Quality checks
on:
  push:
    branches: [main, updating-mail-delivery-system, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:postgres -w backend
      - run: docker compose config --quiet
